<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magazine spike v11</title>
<style>
  html, body { margin:0; height:100%; background:#f1eee8; overflow:hidden; font-family: ui-monospace, Menlo, monospace; }
  canvas { display:block; }
  .hud { position:fixed; color:#3a3a3a; font-size:11px; letter-spacing:.06em; }
  .tl { left:20px; top:18px; display:flex; gap:10px; align-items:center; pointer-events:none; }
  .logo { background:#ff5714; color:#fff; padding:3px 8px; font-weight:700; }
  .ttl { font-family: system-ui, sans-serif; font-weight:700; font-size:14px; }
  .br { right:24px; bottom:22px; text-align:right; pointer-events:none; }
  .state { font-family: system-ui, sans-serif; font-weight:800; font-size:30px; color:#ff5714; letter-spacing:.04em; }
  .bl { left:20px; bottom:22px; color:#888; pointer-events:none; }
  .cam { right:20px; top:16px; background:rgba(255,255,255,.82); border:1px solid rgba(0,0,0,.08); border-radius:8px; padding:10px 12px; width:250px; font-family: system-ui, sans-serif; }
  .cam h4 { margin:0 0 6px; font-size:12px; }
  .cam .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .cam button { font: inherit; font-size:12px; border:1px solid #ccc; background:#fff; border-radius:99px; padding:4px 10px; cursor:pointer; }
  .cam button.on { background:#ff5714; border-color:#ff5714; color:#fff; }
  .cam p { margin:8px 0 0; font-size:11px; color:#666; line-height:1.5; }
  .cam code { font-family: ui-monospace, Menlo, monospace; font-size:11px; color:#333; user-select:all; }
  .cam .sl { display:grid; grid-template-columns: 74px 1fr 40px; align-items:center; gap:4px; font-size:11px; margin-top:4px; }
  .cam .sl input { width:100%; }
  .cam .sl span:last-child { text-align:right; font-family: ui-monospace, Menlo, monospace; }
  .cam h5 { margin:10px 0 2px; font-size:11px; color:#555; }
  .cam { width:280px; max-height: calc(100vh - 40px); overflow:auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="hud tl"><span class="logo">JJJ</span><span class="ttl">ジャンクジャーナル 1冊目 /</span><span>RANDOM PICK</span></div>
<div class="hud bl">AUTO TURN ・ <span id="pg">01 / 06</span></div>
<div class="hud br"><div class="state" id="state">TURNING</div></div>
<div class="hud cam">
  <h4>カメラの角度（試作用）</h4>
  <div class="btns" id="presets"></div>
  <p>左ドラッグ: 回す ／ 右ドラッグ・Shift+ドラッグ: 平行移動 ／ ホイール: 寄る・引く</p>
  <h5>カメラの位置</h5><div id="slCam"></div>
  <h5>注視点（カメラが向く先）</h5><div id="slTgt"></div>
  <h5>レンズ</h5><div id="slLens"></div>
  <p>気に入ったら、この行をそのまま教えてください:<br><code id="camPos"></code></p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1.35, H = 1.8, SEG_U = 60, SEG_V = 6, LEAVES = 6;
const IMAGES = ['p0','p1','p2','p3','p4','p5'].map(n => `/files/${n}.png`);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f1eee8');
scene.fog = new THREE.Fog('#f1eee8', 7, 15);

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = true;
controls.screenSpacePanning = true;
controls.keyPanSpeed = 20;
controls.listenToKeyEvents(window);
controls.minDistance = 1.5; controls.maxDistance = 16;
controls.target.set(0.61, 0.14, -0.15);

// 角度の候補（いずれも右側から。高さと寄りを変えている）
const PRESETS = {
  '選んだ構図':      [1.95, 3.03, 0.79],
  '1つ前の構図':     [2.28, 1.86, 1.27],
  '前の角度':        [3.4, 3.6, 4.2],
  '低め・横から':    [4.6, 1.5, 3.0],
  '高め・俯瞰寄り':  [2.2, 5.6, 2.8],
  '寄り・背表紙側':  [2.6, 2.0, 1.6],
  '引き・奥行き':    [6.0, 3.2, 6.4],
};
let camTo = null;
const presetsEl = document.getElementById('presets');
for (const [name, pos] of Object.entries(PRESETS)) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { follow = name === '選んだ構図'; camTo = follow ? null : new THREE.Vector3(...pos); [...presetsEl.children].forEach(x => x.classList.toggle('on', x === b)); };
  presetsEl.appendChild(b);
}
camera.position.set(...PRESETS['選んだ構図']);
camera.setFocalLength(44);
presetsEl.firstChild.classList.add('on');
let dragging = false;
let follow = true;               // 右ページの重心を画面中央に保つ
const viewOffset = new THREE.Vector3(1.95 - 0.61, 3.03 - 0.14, 0.79 - (-0.15)); // 選んだ構図の「注視点→カメラ」
const centroid = new THREE.Vector3(), smoothed = new THREE.Vector3(0.61, 0.14, -0.15);
controls.addEventListener('end', () => { dragging = false; });
controls.addEventListener('start', () => { dragging = true; follow = false; camTo = null; [...presetsEl.children].forEach(x => x.classList.remove('on')); });

// 位置・注視点・画角のスライダー（値はフレームごとに実際のカメラと同期）
const sliders = [];
function slider(parent, label, min, max, step, get, set) {
  const row = document.createElement('div'); row.className = 'sl';
  const name = document.createElement('span'); name.textContent = label;
  const input = document.createElement('input'); input.type = 'range'; input.min = min; input.max = max; input.step = step;
  const val = document.createElement('span');
  input.addEventListener('input', () => { camTo = null; [...presetsEl.children].forEach(x => x.classList.remove('on')); set(Number(input.value)); });
  row.append(name, input, val); document.getElementById(parent).appendChild(row);
  sliders.push(() => { const v = get(); if (document.activeElement !== input) input.value = v; val.textContent = v.toFixed(step < 0.01 ? 4 : step < 1 ? 2 : 0); });
}
const P = camera.position, T = controls.target;
slider('slCam', '左右 x', -8, 8, 0.05, () => P.x, v => { P.x = v; });
slider('slCam', '高さ y', -2, 9, 0.05, () => P.y, v => { P.y = v; });
slider('slCam', '前後 z', -8, 8, 0.05, () => P.z, v => { P.z = v; });
slider('slTgt', '左右 x', -2, 2, 0.02, () => T.x, v => { T.x = v; });
slider('slTgt', '高さ y', -1.5, 2, 0.02, () => T.y, v => { T.y = v; });
slider('slTgt', '前後 z', -2, 2, 0.02, () => T.z, v => { T.z = v; });
const focalOf = () => camera.getFocalLength();
slider('slLens', '焦点距離mm', 18, 135, 1, focalOf, v => { camera.setFocalLength(v); });
slider('slLens', 'ぼけ', 0, 0.006, 0.0002, () => bokehAperture, v => { bokehAperture = v; });
let bokehAperture = 0.006;

scene.add(new THREE.HemisphereLight('#ffffff', '#e2dacb', 1.6));
const key = new THREE.DirectionalLight('#fff6ea', 1.5);
key.position.set(-2.5, 5, 2);
scene.add(key);
const rim = new THREE.DirectionalLight('#ffd9c4', 0.6);
rim.position.set(3, 1, -3);
scene.add(rim);

// 真下のぼんやりした影
const blob = document.createElement('canvas'); blob.width = blob.height = 256;
{ const g = blob.getContext('2d'); const gr = g.createRadialGradient(128,128,0,128,128,128); gr.addColorStop(0,'rgba(60,45,30,0.22)'); gr.addColorStop(1,'rgba(60,45,30,0)'); g.fillStyle = gr; g.fillRect(0,0,256,256); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 3.0), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blob), transparent: true, depthWrite: false }));
ground.rotation.x = -Math.PI / 2; ground.position.set(0, -1.6, 0);
scene.add(ground);

function paperTexture(img, mirror) {
  const c = document.createElement('canvas'); c.width = 900; c.height = 1200;
  const g = c.getContext('2d');
  g.fillStyle = '#fbf8f1'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(120,100,70,${Math.random() * 0.025})`; g.fillRect(Math.random() * 900, Math.random() * 1200, 2, 2); }
  const m = 70;
  g.drawImage(img, m, m, c.width - m * 2, c.height - m * 2 - 90);
  g.fillStyle = '#9a9188'; g.font = '22px monospace'; g.fillText('JUNK JOURNAL JOURNEY', m, c.height - 70);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (mirror) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; }
  return t;
}

function pageGeometry() {
  const g = new THREE.BufferGeometry();
  const n = (SEG_U + 1) * (SEG_V + 1);
  const uv = new Float32Array(n * 2), idx = [];
  for (let j = 0; j <= SEG_V; j++) for (let i = 0; i <= SEG_U; i++) { const k = j * (SEG_U + 1) + i; uv[k*2] = i / SEG_U; uv[k*2+1] = 1 - j / SEG_V; }
  for (let j = 0; j < SEG_V; j++) for (let i = 0; i < SEG_U; i++) { const a = j*(SEG_U+1)+i, b = a+1, c = a+SEG_U+1, d = c+1; idx.push(a, c, b, b, c, d); }
  g.setIndex(idx);
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}

/*
 * 右に寝ているページの、背からの距離 s における向き（水平からの角度）。
 * 背のところで RISE だけ立ち上がり、外側へ行くほど重力で垂れて SAG まで下がる。
 */
const RISE = THREE.MathUtils.degToRad(58), SAG = THREE.MathUtils.degToRad(-14), FALL = 0.32;
const restAngle = s => SAG + (RISE - SAG) * Math.exp(-s / FALL);

/*
 * 1 枚のページの形。p はめくりの進み（0 = 右、1 = 左）。
 * 外側ほど遅れてついてくる（空気と重さでしなる）ので、位置ごとに進みをずらす。
 * offset はページの重なり。縦ではなく紙の面に垂直な方向に離すので、背の近くで紙が立っていても埋まらない。
 */
function shapePage(geo, p, offRight, offLeft, air, flutter) {
  const pos = geo.attributes.position;
  const du = W / SEG_U;
  const LAG = 0.55;
  for (let j = 0; j <= SEG_V; j++) {
    const v = (j / SEG_V - 0.5) * H;
    const edge = Math.abs(j / SEG_V - 0.5) * 2;          // 上下の端ほど 1（角がわずかに余計に垂れる）
    let x = 0, y = 0;
    for (let i = 0; i <= SEG_U; i++) {
      const s = i * du, f = s / W;
      const ps = THREE.MathUtils.clamp(p * (1 + LAG) - LAG * f, 0, 1);
      const eps = ps * ps * (3 - 2 * ps);
      const aR = restAngle(s) - edge * 0.06 * f;
      const aL = Math.PI - aR;
      let a = aR + (aL - aR) * eps;
      a += flutter * Math.sin(Math.PI * eps) * Math.sin(f * Math.PI);
      if (i > 0) { x += Math.cos(a) * du; y += Math.sin(a) * du; }
      // 紙の面に垂直な方向（法線）へ離す。右に寝ている間は表が上、左に寝ると裏が上なので、
      // 上向きに離すには左側では向きを反転する。めくっている途中は束から浮かせる
      const o = offRight * (1 - eps) - offLeft * eps + air * Math.sin(Math.PI * eps) * (eps < 0.5 ? 1 : -1);
      pos.setXYZ(j * (SEG_U + 1) + i, x - Math.sin(a) * o, y + Math.cos(a) * o, v);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

const magazine = new THREE.Group();
scene.add(magazine);

const loader = new THREE.ImageLoader();
const imgs = await Promise.all(IMAGES.map(src => new Promise(r => loader.load(src, r))));

const leaves = [];
for (let i = 0; i < LEAVES; i++) {
  const geo = pageGeometry();
  const front = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: paperTexture(imgs[(2 * i) % 6], false), side: THREE.FrontSide, roughness: 0.92 }));
  const back = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: paperTexture(imgs[(2 * i + 1) % 6], true), side: THREE.BackSide, roughness: 0.92 }));
  magazine.add(front, back);
  leaves.push(geo);
}
// 表紙: 内側は紙の色、外側（下になる面）だけオレンジ
const coverIn = new THREE.MeshStandardMaterial({ color: '#efe7da', roughness: 0.85, side: THREE.DoubleSide });
const coverOut = new THREE.MeshStandardMaterial({ color: '#e4572e', roughness: 0.7, side: THREE.DoubleSide });
const coverR = new THREE.Mesh(pageGeometry(), coverIn), coverL = new THREE.Mesh(pageGeometry(), coverIn);
const coverRo = new THREE.Mesh(pageGeometry(), coverOut), coverLo = new THREE.Mesh(pageGeometry(), coverOut);
magazine.add(coverR, coverL, coverRo, coverLo);

// 幾何学アニメーション
const rings = new THREE.Group(); rings.position.y = -1.05; magazine.add(rings);
const orange = new THREE.Color('#ff5714');
[[1.5,false,0.55],[1.95,true,0.4],[1.0,false,0.3],[2.5,true,0.22]].forEach(([r, dashed, op]) => {
  const pts = []; for (let a = 0; a <= 128; a++) pts.push(new THREE.Vector3(Math.cos(a/128*Math.PI*2)*r, 0, Math.sin(a/128*Math.PI*2)*r));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = dashed ? new THREE.LineDashedMaterial({ color: orange, dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: op }) : new THREE.LineBasicMaterial({ color: orange, transparent: true, opacity: op });
  const line = new THREE.Line(g, mat); if (dashed) line.computeLineDistances();
  line.userData.speed = (dashed ? -1 : 1) * (0.05 + r * 0.03); rings.add(line);
});
for (let a = 0; a < 60; a++) {
  const ang = a/60*Math.PI*2, r0 = 2.15, r1 = a % 5 === 0 ? 2.32 : 2.22;
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(ang)*r0,0,Math.sin(ang)*r0), new THREE.Vector3(Math.cos(ang)*r1,0,Math.sin(ang)*r1)]), new THREE.LineBasicMaterial({ color: '#333', transparent: true, opacity: 0.25 }));
  l.userData.speed = 0.03; rings.add(l);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 5, aperture: 0.0012, maxblur: 0.006 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const T_FLIP = 1.9, T_GAP = 2.5, T_RIFFLE = 0.12, GAP = 0.012;
const fwdEnd = LEAVES * T_GAP + 1.2, cycle = fwdEnd + LEAVES * T_RIFFLE + 1.8;
function leafProgress(i, t) {
  if (t < fwdEnd) return ease(THREE.MathUtils.clamp((t - i * T_GAP) / T_FLIP, 0, 1));
  return 1 - ease(THREE.MathUtils.clamp((t - fwdEnd - (LEAVES - 1 - i) * T_RIFFLE) / 0.8, 0, 1));
}

const stateEl = document.getElementById('state'), pgEl = document.getElementById('pg'), camEl = document.getElementById('camPos');
const focusPoint = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  const time = clock.getElapsedTime(), t = time % cycle;
  let flipping = 0, done = 0;
  leaves.forEach((geo, i) => {
    const p = leafProgress(i, t);
    if (p > 0.02 && p < 0.98) flipping++;
    if (p >= 0.98) done++;
    // 右の束では若い番号ほど上、左の束では後からめくったものほど上。めくっている間は束より上を通る
    shapePage(geo, p, (LEAVES - i + 1) * GAP, (i + 2) * GAP, (LEAVES + 2) * GAP, 0.18 * Math.sin(time * 2.4 + i));
  });
  shapePage(coverR.geometry, 0, GAP * 0.5, 0, 0, 0);
  shapePage(coverL.geometry, 1, 0, GAP * 0.5, 0, 0);
  shapePage(coverRo.geometry, 0, -GAP * 0.6, 0, 0, 0);
  shapePage(coverLo.geometry, 1, 0, -GAP * 0.6, 0, 0);

  stateEl.textContent = t > fwdEnd ? 'RIFFLE' : flipping ? 'TURNING' : 'HOLDING';
  pgEl.textContent = `${String(Math.min(done + 1, LEAVES)).padStart(2, '0')} / ${String(LEAVES).padStart(2, '0')}`;

  magazine.position.y = Math.sin(time * 0.7) * 0.06;
  magazine.rotation.set(0.06, 0.3 + Math.sin(time * 0.25) * 0.06, -0.05 + Math.sin(time * 0.5) * 0.02);
  ground.scale.setScalar(1 - magazine.position.y * 0.6);
  rings.children.forEach(l => { l.rotation.y += l.userData.speed * 0.016; });

  if (camTo) { camera.position.lerp(camTo, 0.06); if (camera.position.distanceTo(camTo) < 0.01) camTo = null; }
  // 手持ちカメラのようなわずかな揺れ（操作中は止める）
  if (!dragging) { camera.position.x += Math.sin(time * 0.31) * 0.0006; camera.position.y += Math.sin(time * 0.23) * 0.0004; }
  controls.update();
  const c = camera.position; camEl.textContent = `cam ${c.x.toFixed(2)},${c.y.toFixed(2)},${c.z.toFixed(2)} target ${T.x.toFixed(2)},${T.y.toFixed(2)},${T.z.toFixed(2)} ${Math.round(focalOf())}mm blur ${bokehAperture.toFixed(4)}`;
  sliders.forEach(f => f());
  bokeh.uniforms.aperture.value = bokehAperture;

  // 右ページ（右の表紙の形＝右の束の形）の頂点の平均を重心とする
  magazine.updateMatrixWorld();
  const cp = coverR.geometry.attributes.position; centroid.set(0, 0, 0);
  for (let k = 0; k < cp.count; k++) { centroid.x += cp.getX(k); centroid.y += cp.getY(k); centroid.z += cp.getZ(k); }
  centroid.divideScalar(cp.count).applyMatrix4(magazine.matrixWorld);
  smoothed.lerp(centroid, 0.05);
  if (follow && !dragging) { T.copy(smoothed); camera.position.copy(smoothed).add(viewOffset); camera.lookAt(T); }
  focusPoint.copy(centroid);
  bokeh.uniforms.focus.value = camera.position.distanceTo(focusPoint);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
